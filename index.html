<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Pengumuman Kelulusan</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: linear-gradient(to right, #0f4c81, #3c8dbc);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .container {
        background: white;
        width: 350px;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        text-align: center;
      }

      .logo {
        width: 100px;
        margin-bottom: 10px;
      }

      h2 {
        margin-bottom: 5px;
        color: #0f4c81;
      }

      p {
        color: #555;
        font-size: 14px;
      }

      input {
        width: 100%;
        padding: 12px;
        margin-top: 15px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 16px;
        box-sizing: border-box;
      }

      button {
        width: 100%;
        padding: 12px;
        margin-top: 15px;
        border: none;
        background: #0f4c81;
        color: white;
        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;
      }

      button:hover {
        background: #08304f;
      }

      .hasil {
        margin-top: 20px;
        padding: 15px;
        border-radius: 10px;
        display: none;
      }

      /* LULUS */
      .lulus {
        background: #d4edda;
        color: #155724;
        border: 2px solid #28a745;
      }

      /* TIDAK LULUS */
      .tidak-lulus {
        background: #f8d7da;
        color: #721c24;
        border: 2px solid #dc3545;
      }

      /* ERROR */
      .error {
        background: #fff3cd;
        color: #856404;
      }

      .foto {
        width: 120px;
        height: 150px;
        object-fit: cover;
        border-radius: 10px;
        border: 3px solid #0f4c81;
        margin-bottom: 10px;
      }

      .nama {
        font-size: 22px;
        font-weight: bold;
        color: #222;
      }

      .kelas {
        font-size: 16px;
        margin-top: 5px;
      }

      .status-text {
        margin-top: 15px;
        font-size: 20px;
        font-weight: bold;
      }

      .btn-download {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 20px;
        background: #0f4c81;
        color: white;
        text-decoration: none;
        border-radius: 8px;
      }

      .footer {
        margin-top: 20px;
        font-size: 13px;
        color: gray;
      }

      .loading {
        margin-top: 15px;
        color: #0f4c81;
      }
    </style>
  </head>

  <body>
    <div class="container">

      <!-- Logo -->
      <img src="find.png" class="logo" />

      <h2>PENGUMUMAN KELULUSAN</h2>

      <p>Masukkan NISN untuk melihat hasil kelulusan</p>

      <!-- Input -->
      <input type="text" id="nisn" placeholder="Masukkan NISN" />

      <!-- Tombol -->
      <button onclick="cekKelulusan()">LOGIN</button>

      <!-- Hasil -->
      <div id="hasil" class="hasil"></div>

    </div>

    <script>
      async function cekKelulusan() {

        const nisn = document.getElementById("nisn").value;

        const hasil = document.getElementById("hasil");

        // loading
        hasil.style.display = "block";
        hasil.className = "hasil";
        hasil.innerHTML = "<div class='loading'>Memproses data...</div>";

        // URL Apps Script
        const url =
          "https://script.google.com/macros/s/AKfycbznDfublGjbUFVBEr_MDROjhpPX6kFIK8tg32W5L_KAqRbSyydITV2cpXreBklVbC0QBg/exec?nisn=" +
          nisn;

        try {

          const response = await fetch(url);

          const text = await response.text();

          const siswa = JSON.parse(text);

          // jika ditemukan
          if (siswa.success) {

            // cek status
            if (siswa.status.toLowerCase().trim().includes("tidak")) {
              hasil.className = "hasil tidak-lulus";
            } else {
              hasil.className = "hasil lulus";
            }

            hasil.innerHTML = `

              <img
                src="${siswa.foto}"
                class="foto"
              >

              <div class="nama">
                ${siswa.nama}
              </div>

              <div class="kelas"><p>Rata-rata nilai : ${siswa.kelas}</p>
              </div>

              <div
                class="status-text"
                style="
                  color:
                  ${
                    siswa.status.toLowerCase().trim().includes("tidak")
                    ? "red"
                    : "green"
                  }
                "
              >
                DINYATAKAN
                ${siswa.status}
              </div>

              <a
                href="${siswa.skl}"
                target="_blank"
                class="btn-download"
              >
                Download SKL
              </a>

              <div class="footer">
                SMK Muhammadiyah 2 Muntilan<br>
                Tahun Ajaran 2025/2026
              </div>

            `;

          } else {

            hasil.className = "hasil error";

            hasil.innerHTML = `
              <p>
                NISN tidak ditemukan
              </p>
            `;
          }

        } catch (error) {

          hasil.className = "hasil error";

          hasil.innerHTML = `
            <p>
              Gagal mengambil data
            </p>
          `;
        }
      }
    </script>
  </body>
</html>
